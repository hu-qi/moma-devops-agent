name: Durable Delivery

on:
  push:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/state.py"
      - "src/devopspilot/orchestration/**"
      - "src/devopspilot/persistence/**"
      - "experiments/durable-delivery-smoke/**"
      - ".github/workflows/durable-delivery.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/state.py"
      - "src/devopspilot/orchestration/**"
      - "src/devopspilot/persistence/**"
      - "experiments/durable-delivery-smoke/**"
      - ".github/workflows/durable-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate restart-safe delivery orchestration
        env:
          PYTHONPATH: src
        run: python experiments/durable-delivery-smoke/main.py
