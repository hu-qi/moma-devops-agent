name: Swarm Skill Candidate

on:
  push:
    paths:
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/adapters/jiuwenswarm/**"
      - "src/devopspilot/persistence/evolution_audit.py"
      - "experiments/swarm-skill-candidate/**"
      - ".github/workflows/swarm-skill-candidate.yml"
  workflow_dispatch:

concurrency:
  group: swarm-skill-candidate-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
  MOMA_MODEL: ${{ vars.MOMA_MODEL }}
  MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
  MOMA_EVOLUTION_MODEL: ${{ vars.MOMA_EVOLUTION_MODEL || vars.MOMA_CODING_MODEL || 'Qwen3-32B' }}
  JIUWENSWARM_CREATOR_REF: "6ab1ed59a8c455cdb9dfe45db34a3a8d42c10d47"
  JIUWENSWARM_CREATOR_ROOT: "_external/jiuwenswarm/jiuwenswarm/resources/agent/workspace/skills/swarmskill-creator"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned JiuwenSwarm creator dependency
        uses: actions/checkout@v4
        with:
          repository: openJiuwen-ai/jiuwenswarm
          ref: ${{ env.JIUWENSWARM_CREATOR_REF }}
          path: _external/jiuwenswarm
          sparse-checkout: |
            jiuwenswarm/resources/agent/workspace/skills/swarmskill-creator
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate MoMA configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMA_API_BASE"
          test -n "$MOMA_MODEL"
          test -n "$MOMA_API_KEY"
          test -f "$JIUWENSWARM_CREATOR_ROOT/SKILL.md"
          test -f "$JIUWENSWARM_CREATOR_ROOT/scripts/validate_swarmskill.py"

      - name: Install OpenJiuwen runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
          python -m pip install "pyyaml>=6,<7"

      - name: Generate and validate sandbox candidate
        env:
          PYTHONPATH: src
        run: python experiments/swarm-skill-candidate/main.py

      - name: Prove production Skills are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- skills/

      - uses: actions/upload-artifact@v4
        with:
          name: swarm-skill-candidate
          path: |
            artifacts/team-pattern-candidate.json
            artifacts/team-pattern-candidate-summary.json
            artifacts/team-pattern-candidate/
          if-no-files-found: error
