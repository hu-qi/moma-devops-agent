name: OpenJiuwen Skill Evolution Candidate

on:
  push:
    paths:
      - "skills/build-debug/**"
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/evolution/**"
      - "src/devopspilot/adapters/openjiuwen/evolution.py"
      - "experiments/openjiuwen-skill-evolution-candidate/**"
      - ".github/workflows/openjiuwen-skill-evolution-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
  MOMA_MODEL: ${{ vars.MOMA_MODEL }}
  MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
  MOMA_REASONING_MODEL: ${{ vars.MOMA_REASONING_MODEL || 'GLM-5.3' }}
  MOMA_EVOLUTION_MODEL: ${{ vars.MOMA_EVOLUTION_MODEL || vars.MOMA_REASONING_MODEL || 'GLM-5.3' }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMA_API_BASE"
          test -n "$MOMA_MODEL"
          test -n "$MOMA_API_KEY"
          test -n "$MOMA_EVOLUTION_MODEL"

      - name: Validate provider syntax
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile             src/devopspilot/contracts/evolution.py             src/devopspilot/evolution/engine.py             src/devopspilot/evolution/gate.py             src/devopspilot/adapters/openjiuwen/evolution.py             experiments/openjiuwen-skill-evolution-candidate/main.py

      - name: Install OpenJiuwen release line
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"

      - name: Generate staged Skill evolution candidate
        env:
          PYTHONPATH: src
        run: python experiments/openjiuwen-skill-evolution-candidate/main.py

      - name: Verify production Skill was not mutated
        shell: bash
        run: |
          set -euo pipefail
          test ! -e skills/build-debug/evolutions.json
          git diff --exit-code -- skills/build-debug

      - uses: actions/upload-artifact@v4
        with:
          name: build-debug-skill-evolution-candidate
          path: artifacts/build-debug-skill-experience-candidate.json
          if-no-files-found: error
