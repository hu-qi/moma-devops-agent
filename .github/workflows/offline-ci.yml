name: Offline Regression and Gates

on:
  push:
    paths:
      - "src/**"
      - "experiments/**"
      - "benchmarks/**"
      - "industry-packs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/offline-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "experiments/**"
      - "benchmarks/**"
      - "industry-packs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/offline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline Suite (15 Smokes + 3 Scripts + Fixture Preconditions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unified offline checks
        run: |
          python scripts/run_offline_checks.py --fail-fast
