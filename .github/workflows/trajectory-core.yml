name: Trajectory Core

on:
  push:
    paths:
      - "src/devopspilot/contracts/trajectory.py"
      - "src/devopspilot/trajectory/**"
      - "experiments/trajectory-smoke/**"
      - ".github/workflows/trajectory-core.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/trajectory.py"
      - "src/devopspilot/trajectory/**"
      - "experiments/trajectory-smoke/**"
      - ".github/workflows/trajectory-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical trajectory
        env:
          PYTHONPATH: src
        run: |
          python experiments/trajectory-smoke/main.py
          python experiments/trajectory-smoke/test_metrics.py
