name: Git Publisher

on:
  push:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/execution.py"
      - "src/devopspilot/adapters/git/**"
      - "src/devopspilot/orchestration/execution.py"
      - "experiments/git-publisher-smoke/**"
      - ".github/workflows/git-publisher.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/execution.py"
      - "src/devopspilot/adapters/git/**"
      - "src/devopspilot/orchestration/execution.py"
      - "experiments/git-publisher-smoke/**"
      - ".github/workflows/git-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact-commit publishing
        env:
          PYTHONPATH: src
        run: python experiments/git-publisher-smoke/main.py
