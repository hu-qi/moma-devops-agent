name: Evolution Core

on:
  push:
    paths:
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/evolution/**"
      - "experiments/evolution-gate-smoke/**"
      - ".github/workflows/evolution-core.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/evolution/**"
      - "experiments/evolution-gate-smoke/**"
      - ".github/workflows/evolution-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate governed evolution core
        env:
          PYTHONPATH: src
        run: python experiments/evolution-gate-smoke/main.py
