name: Delivery Loop

on:
  push:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/providers.py"
      - "src/devopspilot/orchestration/**"
      - "experiments/delivery-loop-smoke/**"
      - ".github/workflows/delivery-loop.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/providers.py"
      - "src/devopspilot/orchestration/**"
      - "experiments/delivery-loop-smoke/**"
      - ".github/workflows/delivery-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run provider-neutral delivery loop
        env:
          PYTHONPATH: src
        run: python experiments/delivery-loop-smoke/main.py
