name: MoMA Capability Spikes

on:
  push:
    paths:
      - ".github/workflows/moma-capability-spikes.yml"
      - "experiments/moma-openjiuwen-poc/capabilities.py"
      - "experiments/jiuwen-agent-team-spike/**"
      - "experiments/jiuwen-rsi-spike/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
  MOMA_MODEL: ${{ vars.MOMA_MODEL }}
  MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}

jobs:
  model-capabilities:
    name: Streaming + Tool Calling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        run: |
          test -n "$MOMA_API_BASE"
          test -n "$MOMA_MODEL"
          test -n "$MOMA_API_KEY"
      - name: Install OpenJiuwen 0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Probe model capabilities
        run: python experiments/moma-openjiuwen-poc/capabilities.py

  agent-team:
    name: Dynamic AgentTeam
    needs: model-capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenJiuwen 0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Run dynamic AgentTeam spike
        run: python experiments/jiuwen-agent-team-spike/main.py

  rsi-injection:
    name: RSI Runtime Injection
    needs: model-capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenJiuwen 0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Run RSI injection smoke
        run: python experiments/jiuwen-rsi-spike/main.py
