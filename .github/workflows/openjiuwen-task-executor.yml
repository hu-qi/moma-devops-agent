name: OpenJiuwen Task Executor

on:
  push:
    paths:
      - "src/devopspilot/contracts/delivery.py"
      - "src/devopspilot/contracts/execution.py"
      - "src/devopspilot/adapters/openjiuwen/**"
      - "experiments/openjiuwen-task-executor/**"
      - "benchmarks/cases/coding-python-off-by-one/**"
      - ".github/workflows/openjiuwen-task-executor.yml"
  workflow_dispatch:

concurrency:
  group: openjiuwen-task-executor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
  MOMA_MODEL: ${{ vars.MOMA_MODEL }}
  MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
  # Live-validated candidate defaults. Repository variables override them.
  MOMA_REASONING_MODEL: ${{ vars.MOMA_REASONING_MODEL || 'GLM-5.3' }}
  MOMA_CODING_MODEL: ${{ vars.MOMA_CODING_MODEL || 'Qwen3-32B' }}
  MOMA_REVIEW_MODEL: ${{ vars.MOMA_REVIEW_MODEL || 'deepseek-v4.1-flash' }}

jobs:
  live-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate MoMA bootstrap configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOMA_API_BASE"
          test -n "$MOMA_MODEL"
          test -n "$MOMA_API_KEY"

      - name: Install OpenJiuwen release line
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"

      - name: Run real TaskExecutor against DevOpsBench
        env:
          PYTHONPATH: src
        run: python experiments/openjiuwen-task-executor/main.py
