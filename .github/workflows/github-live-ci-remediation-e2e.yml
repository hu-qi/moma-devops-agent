name: GitHub Live CI Remediation E2E

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Controlled remediation E2E issue number
        required: true
        default: "4"
        type: string
      target_branch:
        description: Resettable fixture base branch
        required: true
        default: devopspilot/fixture-ci-remediation
        type: string

concurrency:
  # Protect the shared fixture branch from concurrent modification and deletion
  group: github-live-remediation-fixture-${{ inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
  MOMA_MODEL: ${{ vars.MOMA_MODEL }}
  MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
  MOMA_REASONING_MODEL: ${{ vars.MOMA_REASONING_MODEL || 'GLM-5.3' }}
  MOMA_CODING_MODEL: ${{ vars.MOMA_CODING_MODEL || 'Qwen3-32B' }}
  MOMA_REVIEW_MODEL: ${{ vars.MOMA_REVIEW_MODEL || 'deepseek-v4.1-flash' }}
  DEVOPSPILOT_E2E_ISSUE: ${{ inputs.issue_number || '4' }}
  DEVOPSPILOT_TARGET_BRANCH: ${{ inputs.target_branch || 'devopspilot/fixture-ci-remediation' }}

jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate runtime configuration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPSPILOT_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "$MOMA_API_BASE"
          test -n "$MOMA_MODEL"
          test -n "$MOMA_API_KEY"
          test -n "$GITHUB_TOKEN"
          test -n "$DEVOPSPILOT_E2E_ISSUE"
          test -n "$DEVOPSPILOT_TARGET_BRANCH"

      - name: Bootstrap and reset fixture base branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ env.DEVOPSPILOT_TARGET_BRANCH }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            echo "Fixture branch $TARGET_BRANCH does not exist on remote; bootstrapping from origin/main..."
            git checkout -B "$TARGET_BRANCH" origin/main
            python e2e/fixtures/ci_remediation/reset.py
            git add e2e/fixtures/ci_remediation/app.py
            git -c user.name=DevOpsPilot -c user.email=devopspilot@local \
              commit -m "chore(fixture): bootstrap CI remediation fixture branch"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "Bootstrap completed: $TARGET_BRANCH"
          else
            echo "Fixture branch $TARGET_BRANCH exists on remote; ensuring clean broken state..."
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            python e2e/fixtures/ci_remediation/reset.py
            if ! git diff --quiet e2e/fixtures/ci_remediation/app.py; then
              git add e2e/fixtures/ci_remediation/app.py
              git -c user.name=DevOpsPilot -c user.email=devopspilot@local \
                commit -m "test: reset CI remediation fixture"
              git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
            fi
          fi
          # Verify reset succeeded; failure blocks E2E execution
          python e2e/fixtures/ci_remediation/reset.py --check
          echo "FIXTURE_BOOTSTRAP_AND_RESET_VERIFIED branch=$TARGET_BRANCH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[runtime]"

      - name: Run live CI failure remediation loop
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.DEVOPSPILOT_GITHUB_TOKEN || github.token }}
        run: python experiments/github-live-ci-remediation-e2e/main.py
