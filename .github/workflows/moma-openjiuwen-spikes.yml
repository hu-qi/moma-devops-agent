name: MoMA × OpenJiuwen Spikes

on:
  workflow_dispatch:
    inputs:
      run_agent_team:
        description: "Run dynamic AgentTeam spike"
        required: true
        type: boolean
        default: true
      run_rsi:
        description: "Run RSI / Skill Evolution spike"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  model-deepagent:
    name: Model + DeepAgent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
      MOMA_MODEL: ${{ vars.MOMA_MODEL }}
      MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$MOMA_API_BASE" || (echo "Missing Actions variable MOMA_API_BASE" && exit 1)
          test -n "$MOMA_MODEL" || (echo "Missing Actions variable MOMA_MODEL" && exit 1)
          test -n "$MOMA_API_KEY" || (echo "Missing Actions secret MOMA_API_KEY" && exit 1)
      - name: Install OpenJiuwen release/v0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Run model and DeepAgent probe
        run: python experiments/moma-openjiuwen-poc/main.py

  agent-team:
    name: Dynamic AgentTeam
    if: ${{ inputs.run_agent_team }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
      MOMA_MODEL: ${{ vars.MOMA_MODEL }}
      MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenJiuwen release/v0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Run AgentTeam spike
        run: python experiments/jiuwen-agent-team-spike/main.py

  rsi:
    name: RSI Skill Evolution
    if: ${{ inputs.run_rsi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOMA_API_BASE: ${{ vars.MOMA_API_BASE }}
      MOMA_MODEL: ${{ vars.MOMA_MODEL }}
      MOMA_API_KEY: ${{ secrets.MOMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenJiuwen release/v0.1.19
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openjiuwen[observability,sqlite] @ git+https://github.com/openJiuwen-ai/agent-core.git@release/v0.1.19"
      - name: Run RSI spike
        run: python experiments/jiuwen-rsi-spike/main.py
