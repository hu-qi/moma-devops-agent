name: Model Routing

on:
  push:
    paths:
      - "src/devopspilot/contracts/model_intelligence.py"
      - "src/devopspilot/contracts/providers.py"
      - "src/devopspilot/adapters/moma/**"
      - "src/devopspilot/routing/**"
      - "experiments/model-routing-smoke/**"
      - ".github/workflows/model-routing.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/model_intelligence.py"
      - "src/devopspilot/contracts/providers.py"
      - "src/devopspilot/adapters/moma/**"
      - "src/devopspilot/routing/**"
      - "experiments/model-routing-smoke/**"
      - ".github/workflows/model-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate provider-neutral model routing
        env:
          PYTHONPATH: src
        run: |
          python experiments/model-routing-smoke/main.py
          python experiments/model-routing-smoke/test_profiler.py
