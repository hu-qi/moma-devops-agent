name: Evolution Opportunity Miner

on:
  push:
    paths:
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/evolution/miner.py"
      - "experiments/evolution-opportunity-miner/**"
      - ".github/workflows/evolution-opportunity-miner.yml"
  pull_request:
    paths:
      - "src/devopspilot/contracts/evolution.py"
      - "src/devopspilot/evolution/miner.py"
      - "experiments/evolution-opportunity-miner/**"
      - ".github/workflows/evolution-opportunity-miner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate evolution opportunity classification
        env:
          PYTHONPATH: src
        run: python experiments/evolution-opportunity-miner/main.py
