<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOpsPilot · 交付工作台</title>
<style>
:root{--bg:#f5f6fa;--ink:#20283e;--muted:#7a8295;--line:#e5e8f0;--blue:#3268f0;--green:#1e9566;--red:#d74c58;--purple:#9b5de5}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;color:var(--ink)}button:hover{border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--blue);color:white;border-color:var(--blue)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}aside{position:fixed;inset:0 auto 0 0;width:244px;background:#fff;border-right:1px solid var(--line);padding:28px 17px;overflow:auto}.brand{font-size:23px;font-weight:750;letter-spacing:-.8px}.brand b{background:var(--blue);color:white;border-radius:11px;display:inline-grid;place-items:center;width:35px;height:35px;margin-right:9px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin:9px 0 28px}.group-label{font-size:10px;letter-spacing:1.5px;color:#959daf;margin:24px 12px 10px}.nav{width:100%;text-align:left;border:0;padding:12px 15px;background:none;margin:2px 0;color:#677088;display:flex;gap:11px;align-items:center}.nav.active{background:#edf2ff;color:var(--blue);font-weight:650}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--blue)}.agent-nav .dot{background:var(--agent)}.sidebar-foot{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:11px}header{margin-left:244px;height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:12px}.project-select{min-width:230px;max-width:390px;background:#f7f8fc;border:1px solid var(--line);border-radius:9px;padding:10px}.top-right{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}main{margin-left:244px;padding:30px 34px;max-width:1800px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:27px;font-weight:650;margin:0 0 8px;letter-spacing:-.7px}h2{font-size:16px;margin:0 0 16px}h3{font-size:14px;margin:0 0 12px}.sub{color:var(--muted);font-size:12px;line-height:1.8}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;margin-bottom:20px;box-shadow:0 3px 8px #20283e03}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.metric{background:white;padding:20px;border:1px solid var(--line);border-radius:13px}.metric strong{font-size:29px;display:block;margin:7px 0}.metric span{color:var(--muted);font-size:12px}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:20px}.stage{position:relative;text-align:left;min-height:144px;background:#f9faff;padding:22px 15px 16px;border:1px solid var(--line);border-radius:13px;border-top:4px solid var(--agent);overflow:hidden}.stage.selected{box-shadow:0 0 0 2px #3268f040}.stage strong{display:block;font-size:14px;margin-bottom:14px}.stage small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:18px}.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:6px;background:#eef0f5;color:#737d91}.badge.complete,.badge.verified{background:#e6f5ed;color:var(--green)}.badge.running,.badge.queued,.badge.ci-pending,.badge.change-opened{background:#eaf0ff;color:var(--blue)}.badge.blocked,.badge.failed,.badge.rejected,.badge.interrupted{background:#fdecee;color:var(--red)}.badge.finished{background:#f1edfc;color:#7f5bc6}.search{width:min(460px,100%);padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:white}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;color:var(--muted);font-weight:500;background:#fafbfe;padding:13px 15px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:17px 15px;border-bottom:1px solid #f0f2f7;font-size:12px}tr.current{background:#f1f5ff}tbody tr:hover{background:#f9fbff}.empty{text-align:center;padding:52px 18px;color:var(--muted);line-height:1.9}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.kv{display:grid;grid-template-columns:105px 1fr;gap:13px;font-size:12px;line-height:1.7}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.code,pre{font:12px ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;padding:16px;border-radius:8px;max-height:450px;overflow:auto;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cards .panel{margin:0}.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}.event{margin-bottom:16px;font-size:12px}.event strong{margin-right:8px}.notice{padding:12px 16px;border-radius:9px;background:#edf2ff;color:#5871a2;font-size:12px;margin:0 0 18px;line-height:1.8}.error{background:#fdecee;color:var(--red)}#toast{position:fixed;bottom:24px;right:24px;max-width:540px;padding:15px 22px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 10px 30px #23304820;z-index:20;display:none}dialog{width:min(580px,94vw);border:1px solid var(--line);border-radius:17px;padding:28px;color:var(--ink)}dialog::backdrop{background:#20283e66}label{display:block;font-size:12px;margin:17px 0 7px;color:var(--muted)}form input,form select,form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px}textarea{min-height:100px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.tag{padding:3px 7px;border-radius:5px;background:#f1f3f8;color:var(--muted);font-size:10px}.hidden{display:none!important}.mono{font-family:ui-monospace,SFMono-Regular,monospace}details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:12px}.mobile-menu{display:none}.chat-answer{white-space:pre-wrap;line-height:1.9;font-size:13px}.delivery-title{border:0;background:none;color:var(--blue);padding:0;text-align:left}
@media(max-width:1050px){aside{width:205px}header,main{margin-left:205px}header{padding:0 22px}main{padding:24px 22px}.pipeline{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.top-right span{display:none}}
@media(max-width:720px){aside{display:none;z-index:30;width:244px;box-shadow:10px 0 40px #20283e30}body.menu-open aside{display:block}header,main{margin-left:0}header{height:72px;padding:0 16px}main{padding:22px 16px}.mobile-menu{display:block}.metrics{grid-template-columns:repeat(2,1fr)}.pipeline,.cards{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.project-select{min-width:100px;width:190px}.top-right{gap:4px}.stage{min-height:110px}}
</style></head><body>
<aside><div class="brand"><b>D</b>DevOpsPilot</div><div class="eyebrow">AUTONOMOUS DELIVERY</div><div class="group-label">工作区</div>
<button class="nav" data-page="overview">◫ 概览仪表盘</button><button class="nav" data-page="requirements">▤ 需求中心</button><button class="nav" data-page="projects">▣ 项目场景</button><button class="nav active" data-page="pipeline">▷ 流水线</button><button class="nav" data-page="schedules">◷ 定时任务</button>
<div class="group-label">DEVOPS AGENTS</div><div id="agent-nav"></div><div class="group-label">场景与知识</div><button class="nav" data-page="skills">◇ 场景 · 技能</button><button class="nav" data-page="knowledge">▧ 项目知识库</button><button class="nav" data-page="benchmarks">◉ DevOpsBench</button><div class="group-label">协作与运行</div><button class="nav" data-page="chat">○ Chat Agent</button><button class="nav" data-page="channels">⇄ IM 渠道</button><button class="nav" data-page="runtime">ϟ Agent 运行时</button><button class="nav" data-page="trajectories">≋ 审计轨迹</button><div class="sidebar-foot">Web Console · 本地交付控制面<br><span id="sidebar-sha">正在读取版本…</span></div></aside>
<header><div class="actions"><button class="mobile-menu" id="menu">☰</button><span class="sub">当前项目</span><select class="project-select" id="project" aria-label="当前项目"><option value="">所有项目</option></select></div><div class="top-right"><span id="last-refresh">持久化数据</span><button id="refresh">↻ 刷新</button></div></header>
<main><div class="page-head"><div><h1 id="page-title">交付流水线</h1><div class="sub" id="page-sub">从真实任务到可追溯的交付证据</div></div><div class="actions"><button id="sync">同步远端 Issue</button><button class="primary" id="new-task">＋ 启动交付</button></div></div><div id="page-error" class="notice error hidden" role="alert"></div><div id="content"><div class="empty">正在读取真实状态…</div></div></main>
<div id="toast" role="status"></div>
<dialog id="task-dialog"><form id="task-form"><h2>启动真实交付</h2><div class="notice">将读取真实 Issue，并调用已配置的 MoMA 模型。代码变更可能创建分支及 PR；问答意图会回复 Issue。结果以 Review、CI 和最终验收证据为准。</div><label>代码托管平台</label><select name="provider"><option value="github">GitHub</option><option value="atomgit">AtomGit</option></select><label>仓库</label><input name="repo" required placeholder="owner/repository"><label>Issue 编号</label><input name="issue" required placeholder="42"><label>任务意图</label><select name="intent"><option value="">自动识别（歧义时暂停）</option><option value="code_change">代码变更</option><option value="inquiry">问答 / 分析</option></select><label>执行模式</label><select name="mode"><option value="single_agent">Single Agent First</option><option value="agent_team">Agent Team</option></select><div class="dialog-actions"><button type="button" data-close="task-dialog">取消</button><button class="primary" type="submit">启动 Live 任务</button></div><div class="sub" id="task-error"></div></form></dialog>
<dialog id="project-dialog"><form id="project-form"><h2>接入项目</h2><label>平台</label><select name="provider"><option value="github">GitHub</option><option value="atomgit">AtomGit</option><option value="cnb">CNB（已有状态查询）</option></select><label>仓库</label><input name="repo" required placeholder="owner/repository"><label>独立测试命令（代码交付必填）</label><input name="test_command" placeholder="python -m pytest tests -q"><label>允许修改路径（逗号分隔）</label><input name="allowed_paths"><label>禁止修改路径（逗号分隔）</label><input name="forbidden_paths"><label>Required CI checks（逗号分隔）</label><input name="required_checks"><div class="dialog-actions"><button type="button" data-close="project-dialog">取消</button><button class="primary">保存项目</button></div></form></dialog>
<dialog id="schedule-dialog"><form id="schedule-form"><h2>定时启动交付</h2><div class="notice">此任务会在指定时间执行真实交付。服务须保持运行；启动失败会保存错误，重启不会重复已分发任务。</div><label>平台</label><select name="provider"><option value="github">GitHub</option><option value="atomgit">AtomGit</option></select><label>仓库</label><input name="repo" required><label>Issue 编号</label><input name="issue" required><label>执行时间（本地时间）</label><input name="time" type="datetime-local" required><label>意图</label><select name="intent"><option value="">自动识别</option><option value="code_change">代码变更</option><option value="inquiry">问答</option></select><div class="dialog-actions"><button type="button" data-close="schedule-dialog">取消</button><button class="primary">创建定时任务</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles=[['vod','VOD Agent','#ec4899'],['issue','Issue Agent','#ef6b58'],['coding','Coding Agent','#3282ee'],['qa','QA Agent','#ac66df'],['sre','SRE Agent','#e9a648']];
const titles={overview:'概览仪表盘',requirements:'需求中心',projects:'项目场景',pipeline:'交付流水线',schedules:'定时任务',skills:'场景 · 技能',knowledge:'项目知识库',benchmarks:'DevOpsBench 评测',chat:'Chat Agent',channels:'IM 渠道',runtime:'Agent 运行时',trajectories:'审计轨迹',agent:'Agent 详情'};
const labels={complete:'完成',pending:'待处理',running:'执行中',queued:'已排队',blocked:'已阻断',failed:'执行失败',finished:'执行结束',interrupted:'中断待恢复',received:'已接入',executed:'已编码','change-opened':'PR 已创建','ci-pending':'等待 CI','ci-passed':'CI 通过',verified:'已验收',rejected:'已拒绝',answered:'已回复',cancelled:'已停止',scheduled:'已预约',dispatched:'已分发'};
let state={page:location.hash.slice(1)||'pipeline',project:localStorage.getItem('devopspilot-project')||'',projects:[],items:[],jobs:[],selected:'',agent:'coding',detail:null,search:'',busy:false};
function badge(v){return `<span class="badge ${esc(v)}">${esc(labels[v]||v||'未知')}</span>`}
function url(v,label){try{const u=new URL(v);if(!['https:','http:'].includes(u.protocol)||u.username||u.password)return '—';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(label||u.href)} ↗</a>`}catch{return '—'}}
function fmt(v){return v?new Date(typeof v==='number'?v*1000:v).toLocaleString():'未记录'}
function json(v){return `<pre>${esc(JSON.stringify(v,null,2))}</pre>`}
function empty(text){return `<div class="panel empty">${esc(text)}</div>`}
function kv(entries){return `<dl class="kv">${entries.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v??'—'}</dd>`).join('')}</dl>`}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',5500)}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error||d.success===false)throw Error(d.error||`HTTP ${r.status}`);return d}
function project(){return state.projects.find(p=>p.id===state.project)}
function taskDialog(issue=''){const p=project(),f=$('#task-form');f.repo.value=p?.repo||'';f.provider.value=p?.provider==='atomgit'?'atomgit':'github';f.issue.value=issue;$('#task-error').textContent='';$('#task-dialog').showModal()}
async function loadBase(){const [p,d,j]=await Promise.all([api('/api/projects'),api('/api/deliveries?project='+encodeURIComponent(state.project)),api('/api/jobs')]);state.projects=p.items;state.items=d.items;state.jobs=j.items.filter(j=>!state.project||j.project===state.project);$('#project').innerHTML='<option value="">所有项目</option>'+p.items.map(p=>`<option value="${esc(p.id)}">${esc(p.provider+' / '+p.repo)}</option>`).join('');$('#project').value=state.project;if(state.selected&&!state.items.some(i=>i.delivery_id===state.selected))state.selected='';if(!state.selected&&state.items.length)state.selected=state.items[0].delivery_id;state.detail=state.selected?await api('/api/deliveries/'+encodeURIComponent(state.selected)):null;$('#last-refresh').textContent='更新于 '+new Date().toLocaleTimeString()}
async function render(){if(state.busy){state.pending=true;return}state.busy=true;$('#page-error').classList.add('hidden');try{await loadBase();$('.page-head h1').textContent=titles[state.page]||titles.pipeline;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page&&(state.page!=='agent'||n.dataset.agent===state.agent)));const content=$('#content');if(state.page==='pipeline')content.innerHTML=renderPipeline();else if(state.page==='requirements')content.innerHTML=renderRequirements();else if(state.page==='projects')content.innerHTML=renderProjects();else if(state.page==='overview')content.innerHTML=await overview();else if(state.page==='agent')content.innerHTML=await agent();else if(state.page==='runtime'||state.page==='channels')content.innerHTML=await runtime();else if(state.page==='schedules')content.innerHTML=await schedules();else if(state.page==='knowledge')content.innerHTML=await knowledge();else if(state.page==='skills')content.innerHTML=await skills();else if(state.page==='benchmarks')content.innerHTML=await benchmarks();else if(state.page==='trajectories')content.innerHTML=await trajectories();else if(state.page==='chat')content.innerHTML=await chats();else{state.page='pipeline';content.innerHTML=renderPipeline()}}catch(e){$('#page-error').textContent=e.message;$('#page-error').classList.remove('hidden');if(!state.items.length)$('#content').innerHTML=empty('数据读取失败，请查看错误并重试。')}finally{state.busy=false;if(state.pending){state.pending=false;render()}}}
function navigate(page,role){state.page=page;state.agent=role||state.agent;location.hash=page;document.body.classList.remove('menu-open');render()}
function renderPipeline(){const d=state.detail,p=d?.payload||{};return (d?`<section class="panel"><div class="actions" style="justify-content:space-between"><div><h2>${esc(d.title)}</h2><span class="sub">Issue #${esc(d.task_id)} · ${esc(d.repository)} · ${esc(d.author||'负责人未记录')} · </span>${badge(d.phase)} <span class="tag">${esc(d.evidence_type)}</span></div><button data-action="report">↓ 下载交付证据</button></div><div class="pipeline">${d.stages.map((s,i)=>`<button class="stage" data-stage="${esc(s.id)}" style="--agent:${roles[i][2]}"><strong><span class="dot" style="background:${roles[i][2]}"></span> ${esc(s.name)}</strong><small title="${esc(s.evidence)}">${esc(s.evidence||'暂无执行证据')}</small>${badge(s.status)}</button>`).join('')}</div></section>`:empty('尚无交付状态。同步真实 Issue 后启动任务，流水线将随持久化检查点更新。'))+`<div class="actions" style="margin-bottom:18px"><input id="task-search" class="search" placeholder="搜索 Issue、标题、仓库、负责人…" value="${esc(state.search)}"><span class="sub">${state.items.length} 条真实持久化记录</span></div><section class="panel table-wrap" style="padding:0"><table><thead><tr><th>问题 / 状态</th><th>标题</th><th>仓库</th><th>Review</th><th>Agent / 阶段</th><th>耗时</th><th>操作</th></tr></thead><tbody>${state.items.filter(i=>JSON.stringify(i).toLowerCase().includes(state.search.toLowerCase())).map(i=>`<tr class="${i.delivery_id===state.selected?'current':''}"><td>#${esc(i.task_id)}<br>${badge(i.phase)}</td><td><button class="delivery-title" data-delivery="${esc(i.delivery_id)}">${esc(i.title)}</button><div class="sub mono">${esc(i.delivery_id)}</div></td><td>${esc(i.repository)}</td><td>${esc(i.verdict||'尚无裁决')}</td><td>${esc(i.phase)}<div class="sub">${esc(i.agent_models?.coding||'')}</div></td><td>${i.elapsed_seconds==null?'未记录':Math.floor(i.elapsed_seconds/60)+'m '+(i.elapsed_seconds%60)+'s'}</td><td><button data-delivery="${esc(i.delivery_id)}">查看</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的交付任务</td></tr>'}</tbody></table></section>`+(d?renderDetail(d):'')+renderJobs()}
function renderDetail(d){const p=d.payload,e=p.execution||{},review=e.review||{},ci=p.ci_run||{},v=p.verification||{};return `<div class="split"><section class="panel"><h2>交付产物与验收</h2>${kv([['源分支',esc(e.source_branch||'未生成')],['Commit SHA',esc(e.commit_sha||'未生成')],['Pull Request',url(p.change_request?.web_url,'查看真实 PR')],['CI 运行',url(ci.web_url,'查看真实 CI')],['CI 结论',esc(ci.conclusion||ci.status||'尚无证据')],['测试',esc(e.test_summary||'尚无记录')],['最终验收',d.completed?'已接受':esc(v.summary||'未验收')]])}<div class="actions"><button data-action="resume">恢复 / 检查 CI</button><button data-action="report">下载证据 JSON</button></div><details><summary>原始持久化状态</summary>${json(p)}</details></section><section class="panel"><h2>独立 Review 与执行轨迹</h2>${kv([['审查者',esc(review.reviewer_id||'未记录')],['裁决',esc(review.verdict||'未记录')],['Diff digest',esc(review.diff_digest||'未记录')],['结论',esc(review.summary||'尚无记录')]])}${(review.findings||[]).map(f=>`<div class="notice">${esc(f.path)}:${esc(f.line)} · ${esc(f.message)}</div>`).join('')}<div class="timeline">${(d.trajectory?.events||[]).slice(-25).map(ev=>`<div class="event"><strong>${esc(ev.name)}</strong>${badge(ev.status)}<div class="sub">${esc(ev.kind)} · #${esc(ev.sequence)}</div><details><summary>工具 / 模型参数</summary>${json(ev.attributes)}</details></div>`).join('')||'<div class="sub">尚无关联轨迹；不推断模型调用和工具结果。</div>'}</div></section></div>`}
function renderJobs(){return `<section class="panel"><h2>后台执行队列</h2><div class="sub">“执行结束”仅指进程退出，交付是否成功由持久化验收结果决定。</div>${state.jobs.map(j=>`<details><summary>${badge(j.state)} ${esc(j.project)} #${esc(j.issue)} · ${fmt(j.created)} · ${esc(j.id)}</summary>${json({exit_code:j.payload.execution_exit_code,error:j.payload.error})}<pre>${esc(j.payload.log||'等待日志…')}</pre>${j.state==='running'?`<button data-cancel-job="${esc(j.id)}">停止执行</button>`:''}</details>`).join('')||'<div class="empty">暂无后台任务</div>'}</section>`}
function renderRequirements(){const projects=state.project?[project()].filter(Boolean):state.projects;return `<div class="notice">Issue 数据来自显式远端同步；页面会保留最近同步时间。启动任务时执行器重新读取真实 Issue，远端失败会停止。</div>`+projects.map(p=>`<section class="panel"><h2>${esc(p.repo)}</h2><div class="sub">来源 ${esc(p.source)} · 同步 ${fmt(p.synced_at)}</div><div class="table-wrap"><table><thead><tr><th>Issue</th><th>标题</th><th>作者</th><th>状态</th><th>操作</th></tr></thead><tbody>${(p.issues||[]).map(i=>`<tr><td>${url(i.url,'#'+i.id)}</td><td>${esc(i.title)}<details><summary>需求正文</summary><pre>${esc(i.body)}</pre></details></td><td>${esc(i.author)}</td><td>${esc(i.state)}</td><td><button data-start-issue="${esc(i.id)}" data-project="${esc(p.id)}">启动交付</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">尚无远端 Issue 数据，点击“同步远端 Issue”获取</td></tr>'}</tbody></table></div></section>`).join('')||empty('先接入一个项目')}
function renderProjects(){return `<div class="actions" style="margin-bottom:20px"><button data-action="add-project">＋ 接入项目</button></div><div class="cards">${state.projects.map(p=>`<section class="panel"><span class="tag">${esc(p.provider)}</span><h2 style="margin-top:14px">${esc(p.repo)}</h2><div class="sub">${url(p.url,'代码仓库')}<br>默认分支 ${esc(p.default_branch||'未同步')}<br>最近同步 ${fmt(p.synced_at)}<br>${(p.issues||[]).length} 条缓存 Issue</div><div class="actions" style="margin-top:18px"><button data-pick-project="${esc(p.id)}">进入项目</button><button data-sync-project="${esc(p.id)}">同步</button><button data-edit-project="${esc(p.id)}">交付配置</button></div></section>`).join('')}</div>`}
async function overview(){const s=await api('/api/status');$('#sidebar-sha').textContent=s.commit_sha.slice(0,12)+' · '+s.release_candidate_tag;const verified=state.items.filter(i=>i.completed).length;return `<div class="metrics">${[['交付记录',state.items.length],['验收通过',verified],['后台运行',state.jobs.filter(j=>j.state==='running').length],['基准题库',s.counts.benchmark_cases]].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong><span>来自当前数据源</span></div>`).join('')}</div><div class="split"><section class="panel"><h2>版本与证据边界</h2>${kv([['版本',esc(s.version)],['当前 SHA',esc(s.commit_sha)],['RC tag',esc(s.release_candidate_tag)],['Python',esc(s.python_version)],['数据库',esc(s.db_path)]])}<div class="notice">记录存在、进程成功退出和 CI 通过均不等于最终验收通过。历史任务也不代表当前代码已通过 Live 验收。</div></section><section class="panel"><h2>项目 CI（远端同步）</h2>${(project()?.ci_runs||[]).slice(0,8).map(r=>`<div class="event">${url(r.url,r.name)} ${badge(r.conclusion||r.status)}<div class="sub mono">${esc(r.sha?.slice(0,12))}</div></div>`).join('')||'<div class="empty">选择项目并同步，读取真实 CI</div>'}</section></div>`+renderJobs()}
async function agent(){const runtime=await api('/api/runtime'),r=roles.find(r=>r[0]===state.agent),d=state.detail;const events=(d?.trajectory?.events||[]).filter(ev=>JSON.stringify(ev).toLowerCase().includes(state.agent==='qa'?'review':state.agent));return `<section class="panel"><h2><span class="dot" style="background:${r[2]}"></span> ${r[1]}</h2>${kv([['角色模型',esc(runtime.models[state.agent])],['模型状态','配置值；成功调用须有轨迹证据'],['实际执行模型',esc(d?.agent_models?.[state.agent==='qa'?'review':state.agent==='coding'?'coding':'leader']||'尚无执行证据')],['当前任务',esc(d?.title||'无任务')],['执行模式',esc(d?.task?.metadata?.mode||'未记录')]])}<div class="notice">这些名称是交付阶段角色；Single Agent First 可能由一个执行 Agent 承担多个阶段，独立 Review 仍按执行器门禁工作。</div></section><section class="panel"><h2>关联执行事件</h2>${events.map(ev=>`<div class="event"><strong>${esc(ev.name)}</strong>${badge(ev.status)}${json(ev.attributes)}</div>`).join('')||'<div class="empty">当前任务没有可归属到该角色的事件</div>'}</section>`}
async function runtime(){const r=await api('/api/runtime');if(state.page==='channels')return `<div class="cards">${r.channels.map(c=>`<section class="panel"><h2>${esc(c.name)}</h2><span class="tag">${esc(c.status)}</span><p class="sub">${esc(c.description)}</p></section>`).join('')}</div>`;return `<div class="split"><section class="panel"><h2>运行依赖与连接配置</h2>${kv([['MoMA 凭据',r.moma_configured?'已配置（未代表连通）':'缺失'],['MoMA 地址',esc(r.api_base)],['OpenJiuwen',r.openjiuwen_installed?'已安装':'未安装'],['数据库',esc(r.db)]])}</section><section class="panel"><h2>模型分工</h2>${kv(Object.entries(r.models).map(([k,v])=>[k,esc(v)]))}</section></div><div class="cards">${Object.entries(r.providers).map(([p,c])=>`<section class="panel"><h2>${esc(p)}</h2><div class="sub">凭据 ${c.configured?'已配置':'未配置'}<br>Live 自动交付 ${c.live_delivery_supported?'已有执行入口':'尚不支持'}</div></section>`).join('')}</div><div style="margin-top:20px">${renderJobs()}</div>`}
async function schedules(){const s=await api('/api/schedules');return `<div class="actions" style="margin-bottom:20px"><button data-action="add-schedule">＋ 创建定时任务</button></div><section class="panel">${s.items.map(i=>`<div class="event"><strong>${esc(i.repo)} #${esc(i.issue)}</strong>${badge(i.state)}<p class="sub">计划 ${fmt(i.due)} ${esc(i.error||'')} ${esc(i.job_id||'')}</p>${i.state==='scheduled'?`<button data-delete-schedule="${esc(i.id)}">取消任务</button>`:''}</div>`).join('')||'<div class="empty">暂无定时任务</div>'}</section>`}
async function knowledge(){const d=await api('/api/knowledge');return `<input id="knowledge-search" class="search" placeholder="搜索项目文档内容…" style="margin-bottom:20px">`+d.items.map((i,n)=>`<section class="panel knowledge-item"><h2>${esc(i.title)}</h2><div class="sub mono">${esc(i.path)}</div><details><summary>阅读文档</summary><pre>${esc(i.content)}</pre></details></section>`).join('')}
async function skills(){const r=await api('/api/rules');return `<div class="notice">以下来自实际行业 Pack 文件。是否在某次任务通过，需要该任务的 gate 证据。</div><div class="cards">${r.packs.map(p=>`<section class="panel"><h2>${esc(p.name||p.pack_id)}</h2><span class="tag">${esc(p.version||'')}</span>${json(p)}</section>`).join('')}</div>`}
async function benchmarks(){const r=await api('/api/benchmarks');return `<div class="notice">题库与 holdout 数量来自实际文件，不代表模型评测成绩。正式收益必须由原始运行结果计算。</div><section class="panel"><h2>${r.total} 道题 · ${r.holdout_count} 道 holdout</h2><table><thead><tr><th>案例</th><th>类别</th><th>数据</th></tr></thead><tbody>${r.cases.map(c=>`<tr><td>${esc(c.case_id||c.id)}</td><td>${esc(c.category)}</td><td><details><summary>查看案例</summary>${json(c)}</details></td></tr>`).join('')}</tbody></table></section>`}
async function trajectories(){const r=await api('/api/trajectories');return `<section class="panel"><h2>持久化轨迹文件</h2>${r.items.map(i=>`<div class="event"><button data-trajectory="${esc(i.trajectory_id)}">${esc(i.trajectory_id)}</button><span class="sub"> ${esc(i.repository)} · ${i.event_count} 事件</span></div>`).join('')||'<div class="empty">尚无持久化轨迹</div>'}<div id="trajectory-detail"></div></section>`}
async function chats(){const r=await api('/api/chat');return `<section class="panel"><h2>项目问答</h2><div class="sub">真实 MoMA 推理，包含当前项目交付摘要；问答不执行工具或 SCM 操作。当前页面加载只读取历史，不自动调用模型。</div><form id="chat-form"><label>问题</label><textarea name="message" required maxlength="6000" placeholder="当前项目有哪些交付尚未通过验收？"></textarea><div class="dialog-actions"><button class="primary">发送到 MoMA</button></div></form></section>${r.items.map(i=>`<section class="panel"><h2>${esc(i.message)}</h2><div class="chat-answer">${esc(i.answer)}</div><p class="sub">${esc(i.model)} · ${fmt(i.created)} · ${esc(JSON.stringify(i.usage))}</p></section>`).join('')}`}
async function sync(p){if(!p){toast('先选择一个项目');return}$('#sync').disabled=true;try{await api('/api/projects/sync',{provider:p.provider,repo:p.repo});toast('已同步真实 Issue 与 CI');await render()}catch(e){toast('同步失败：'+e.message)}finally{$('#sync').disabled=false}}
$('#agent-nav').innerHTML=roles.map(([id,name,color])=>`<button class="nav agent-nav" data-page="agent" data-agent="${id}" style="--agent:${color}"><span class="dot"></span>${name}</button>`).join('');
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.page)navigate(b.dataset.page,b.dataset.agent);if(b.dataset.close)$('#'+b.dataset.close).close();if(b.dataset.delivery){state.selected=b.dataset.delivery;await render()}if(b.dataset.stage)navigate('agent',b.dataset.stage);if(b.dataset.startIssue){state.project=b.dataset.project;taskDialog(b.dataset.startIssue)}if(b.dataset.pickProject){state.project=b.dataset.pickProject;navigate('pipeline')}if(b.dataset.syncProject)await sync(state.projects.find(p=>p.id===b.dataset.syncProject));if(b.dataset.action==='add-project'){ $('#project-form').reset(); $('#project-dialog').showModal(); } if(b.dataset.editProject){const p=state.projects.find(p=>p.id===b.dataset.editProject),f=$('#project-form');f.reset();f.repo.value=p.repo;f.provider.value=p.provider;for(const [k,v] of Object.entries(p.trusted_config||{}))f.elements[k].value=v;$('#project-dialog').showModal();}if(b.dataset.action==='add-schedule'){const p=project(),f=$('#schedule-form');f.repo.value=p?.repo||'';f.provider.value=p?.provider==='atomgit'?'atomgit':'github';$('#schedule-dialog').showModal()}if(b.dataset.action==='report'){const blob=new Blob([JSON.stringify(state.detail,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=state.detail.delivery_id+'-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if(b.dataset.action==='resume'){b.disabled=true;const d=state.detail;await api('/api/deliveries',{action:'resume',delivery_id:d.delivery_id,provider:d.provider,repo:d.repository,issue:d.task_id});toast('恢复任务已排队');await render()}if(b.dataset.cancelJob){await api('/api/jobs/cancel',{job_id:b.dataset.cancelJob});toast('任务已停止，已完成的远端操作保留');await render()}if(b.dataset.deleteSchedule){await api('/api/schedules',{delete:true,id:b.dataset.deleteSchedule});await render()}if(b.dataset.trajectory){const d=await api('/api/trajectories/'+encodeURIComponent(b.dataset.trajectory));$('#trajectory-detail').innerHTML=json(d)}}catch(err){toast(err.message)}finally{b.disabled=false}});
$('#project').addEventListener('change',()=>{state.project=$('#project').value;localStorage.setItem('devopspilot-project',state.project);state.selected='';render()});$('#refresh').onclick=render;$('#sync').onclick=()=>sync(project());$('#new-task').onclick=()=>taskDialog();$('#menu').onclick=()=>document.body.classList.toggle('menu-open');
document.addEventListener('input',e=>{if(e.target.id==='task-search'){state.search=e.target.value;const pos=e.target.selectionStart;$('#content').innerHTML=renderPipeline();$('#task-search').focus();$('#task-search').setSelectionRange(pos,pos)}if(e.target.id==='knowledge-search')document.querySelectorAll('.knowledge-item').forEach(el=>el.classList.toggle('hidden',!el.textContent.toLowerCase().includes(e.target.value.toLowerCase())))});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button.primary'),data=Object.fromEntries(new FormData(f));if(b)b.disabled=true;try{if(f.id==='task-form'){const r=await api('/api/deliveries',data);$('#task-dialog').close();state.selected=r.job_id;navigate('pipeline');toast(r.deduplicated?'已存在同一任务，未重复启动':'Live 任务已进入后台队列')}if(f.id==='project-form'){const p=await api('/api/projects',data);state.project=p.id;$('#project-dialog').close();navigate('projects')}if(f.id==='schedule-form'){data.due=new Date(data.time).getTime()/1000;await api('/api/schedules',data);$('#schedule-dialog').close();await render()}if(f.id==='chat-form'){await api('/api/chat',{message:data.message,project:state.project});await render()}}catch(err){if(f.id==='task-form')$('#task-error').textContent=err.message;else toast(err.message)}finally{if(b)b.disabled=false}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(page&&page!==state.page)navigate(page)});
api('/api/status').then(s=>$('#sidebar-sha').textContent=s.commit_sha.slice(0,12)+' · '+s.release_candidate_tag).catch(()=>{});render();setInterval(()=>{if(!document.querySelector('dialog[open]')&&!document.querySelector('details[open]')&&!document.querySelector('textarea:focus')&&!document.querySelector('input:focus')&&['pipeline','overview','runtime'].includes(state.page))render()},5000);
</script></body></html>
